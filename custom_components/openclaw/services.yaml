send_message:
  name: Send message
  description: Send a text message to the OpenClaw gateway and fire the resulting reply as an event.
  fields:
    message:
      name: Message
      description: The message text to send to OpenClaw.
      required: true
      example: "What's the weather like today?"
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Optional source hint (for example "voice" or "automation").
      required: false
      selector:
        text:
    session_id:
      name: Session ID
      description: Optional conversation session ID. Messages with the same session ID share context.
      required: false
      example: "my-automation-session"
      selector:
        text:
    agent_id:
      name: Agent ID
      description: Optional OpenClaw agent ID to route this message to. Overrides the configured agent.
      required: false
      example: "main"
      selector:
        text:
clear_history:
  name: Clear history
  description: Clear the in-memory conversation history for a session.
  fields:
    session_id:
      name: Session ID
      description: Session ID to clear. If omitted, clears all sessions.
      required: false
      selector:
        text:
invoke_tool:
  name: Invoke tool
  description: Invoke a single OpenClaw gateway tool via POST /tools/invoke.
  fields:
    tool:
      name: Tool
      description: Tool name to invoke.
      required: true
      example: "sessions_list"
      selector:
        text:
    action:
      name: Action
      description: Optional action string passed to the tool endpoint.
      required: false
      example: "json"
      selector:
        text:
    args:
      name: Args
      description: Tool-specific args object.
      required: false
      selector:
        object:
    session_key:
      name: Session key
      description: Optional target OpenClaw session key.
      required: false
      example: "main"
      selector:
        text:
    dry_run:
      name: Dry run
      description: Optional dry-run flag (reserved by the gateway).
      required: false
      selector:
        boolean:
    message_channel:
      name: Message channel
      description: Optional channel hint header (e.g. slack, telegram).
      required: false
      selector:
        text:
    account_id:
      name: Account ID
      description: Optional account hint header for multi-account routing.
      required: false
      selector:
        text:
query_image:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: openclaw
    model:
      example: openclaw:main
      selector:
        text:
    prompt:
      example: "What's in this image?"
      required: true
      selector:
        text:
          multiline: true
    images:
      example: '{"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Gfp-wisconsin-madison-the-nature-boardwalk.jpg/2560px-Gfp-wisconsin-madison-the-nature-boardwalk.jpg"}'
      required: true
      default: []
      selector:
        object:
    max_tokens:
      example: 300
      default: 300
      selector:
        number:
          min: 1
          mode: box
download_skill:
  name: Download skill
  description: Download a skill from the GitHub repository and install it to the user skills directory. Available skills can be found at https://github.com/mtorazzi/openclaw-ha/tree/develop/examples/skills
  fields:
    skill_name:
      required: true
      example: crypto
      description: Name of the skill to download (e.g., crypto, weather, calendar)
      selector:
        text:
reload_skills:
  name: Reload skills
  description: Reload all skills from the user skills directory to pick up changes or newly added skills
